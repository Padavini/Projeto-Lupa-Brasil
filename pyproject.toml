[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lupa"]

[project]
name = "lupa-camara"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.14.0",
    "catboost>=1.2.10",
    "faiss-cpu>=1.15.0",
    "fastapi>=0.141.1",
    "hdbscan>=0.8.44",
    "imbalanced-learn>=0.14.2",
    "joblib>=1.5.3",
    "jupyter>=1.1.1",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.2",
    "lightgbm>=4.7.0",
    "llvmlite>=0.44",
    "matplotlib>=3.11.1",
    "mlflow>=2.14",
    "numba>=0.61",
    "numpy>=2.5.1",
    "optuna>=4.9.0",
    "pandas>=2.2,<3",
    "peft>=0.20.0",
    "plotly>=6.9.0",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "sentence-transformers>=5.7.0",
    "shap>=0.46",
    "sqlalchemy>=2.0.51",
    "statsmodels>=0.14.6",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers>=5.14.1",
    "umap-learn>=0.5.12",
    "uvicorn[standard]>=0.52.1",
    "xgboost>=3.3.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "httpx>=0.28.1",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.black]
line-length = 100
target-version = ["py313"]
extend-exclude = "notebooks"
